<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Sign in — EZYMED</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <span class="logo-icon">+</span>
        <span class="logo-text">EZYMED</span>
      </a>
      <nav class="nav-links">
        <a href="/register.html" class="btn btn-outline">Create account</a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to your patient portal</p>
      <div id="alertBox"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Your password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      </form>
      <form id="mfaForm" hidden>
        <div class="form-group">
          <label>Authenticator code</label>
          <input type="text" name="code" inputmode="numeric" maxlength="6" required placeholder="6-digit code" autocomplete="one-time-code">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Verify &amp; sign in</button>
      </form>
      <p class="auth-footer">
        Don't have an account? <a href="/register.html">Register here</a>
      </p>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
