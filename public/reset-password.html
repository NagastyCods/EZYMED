<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Choose new password — EZYMED</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <h1>New password</h1>
      <p class="subtitle">Enter a new password for your account</p>
      <div id="alertBox"></div>
      <form id="resetForm">
        <div class="form-group">
          <label for="password">New password</label>
          <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Update password</button>
      </form>
      <p class="auth-footer"><a href="/login.html">Back to sign in</a></p>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/account-recovery.js"></script>
  <script>
    initResetPasswordForm('resetForm', 'alertBox');
  </script>
</body>
</html>
