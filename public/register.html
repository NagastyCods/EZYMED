<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Register — EZYMED</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <span class="logo-icon">+</span>
        <span class="logo-text">EZYMED</span>
      </a>
      <nav class="nav-links">
        <a href="/login.html" class="btn btn-ghost">Sign in</a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Create account</h1>
      <p class="subtitle">Join EZYMED and manage your health from home</p>
      <div id="alertBox"></div>
      <form id="registerForm">
        <div class="form-row">
          <div class="form-group">
            <label for="firstName">First name *</label>
            <input type="text" id="firstName" name="firstName" required autocomplete="given-name">
          </div>
          <div class="form-group">
            <label for="lastName">Last name *</label>
            <input type="text" id="lastName" name="lastName" required autocomplete="family-name">
          </div>
        </div>
        <div class="form-group">
          <label for="email">Email address *</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="phone">Phone number</label>
          <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="+234 ...">
        </div>
        <div class="form-group">
          <label for="dateOfBirth">Date of birth</label>
          <input type="date" id="dateOfBirth" name="dateOfBirth">
        </div>
        <div class="form-group">
          <label for="password">Password *</label>
          <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm password *</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>
      <p class="auth-footer">
        Already registered? <a href="/login.html">Sign in</a>
      </p>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
