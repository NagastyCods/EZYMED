<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Forgot password — EZYMED</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <h1>Reset password</h1>
      <p class="subtitle">We'll email you a link to choose a new password</p>
      <div id="alertBox"></div>
      <form id="forgotForm">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
      </form>
      <p class="auth-footer"><a href="/login.html">Back to sign in</a></p>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/account-recovery.js"></script>
  <script>
    initForgotPasswordForm('forgotForm', 'alertBox');
  </script>
</body>
</html>
